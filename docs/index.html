<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Energy Model Results</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>

<main class="container">

    <h1>Energy Model Results</h1>
    <p class="subtitle">
        Explore EnergyPlus simulation results across Indian climate zones.
    </p>

    <div class="controls">

        <div class="control">
            <label for="climateSelect">Climate Zone</label>

            <select id="climateSelect">
                <option value="">Select climate zone</option>
                <option value="Cold">Cold</option>
                <option value="Composite">Composite</option>
                <option value="Temperate">Temperate</option>
                <option value="Hot & Dry">Hot & Dry</option>
                <option value="Warm & Humid">Warm & Humid</option>
            </select>
        </div>

        <div class="control metric-control">
            <label for="metricSearch">Variable / Metric</label>

            <input
                id="metricSearch"
                type="text"
                placeholder="Select a climate zone first..."
                autocomplete="off"
                disabled
            >

            <div id="suggestions" class="suggestions"></div>
        </div>

    </div>

    <div id="status" class="status">
        Select a climate zone to begin.
    </div>

    <div id="metricInfo" class="metric-info" hidden></div>

    <div id="chartContainer" hidden>
        <div id="chart"></div>
    </div>

</main>

<script src="app.js"></script>

</body>
</html>
